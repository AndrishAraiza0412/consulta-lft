services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: lft
      POSTGRES_PASSWORD: lft
      POSTGRES_DB: lft
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lft"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
